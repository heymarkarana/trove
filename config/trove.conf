# Trove Configuration File (optional)
#
# Auto-sourced by lib/trove_init.zsh if present. Every setting uses the
# `: ${VAR:=value}` form so an explicit environment variable always WINS over
# this file, and this file wins over the built-in defaults:
#
#     environment variable  >  this file  >  built-in default
#
# Delete this file to configure Trove purely by environment variables.

###############################################################################
# Logging
###############################################################################

# Log level filter — only messages at or above this level are shown.
# Levels: TRACE | DEBUG | INFO | WARN | ERROR | FATAL
: ${TROVE_LOG_LEVEL:=INFO}

# Master output switch. Set false to silence ALL Trove output ("logging off").
: ${TROVE_ENABLE_LOGGING:=true}

# Show command output in trove_silent_run (true|false).
# true  -> command runs with native, live stdout/stderr on the terminal.
# false -> command output is suppressed on the terminal but CAPTURED to the
#          verbose file sink (was /dev/null before v1.2.0).
: ${TROVE_OUTPUT_DISPLAY:=true}

###############################################################################
# Verbose File Sink (always-on log — new in v1.2.0)
###############################################################################
# A second, independent output target that ALWAYS records at full verbosity
# (plain text, timestamped, no color) regardless of the terminal level, and even
# when TROVE_ENABLE_LOGGING=false silences the terminal. Point a human or an LLM
# at these files to troubleshoot. See docs/API.md and docs/migrations/1.2.0.md.

# Master switch for the file sink (independent of the terminal switch above).
: ${TROVE_FILE_LOGGING:=true}

# Channel / application name. Each app sets its own (e.g. beskar, dotfiles); logs
# are written per-app and per-actor: <dir>/<app>-<user>-YYYY-MM-DD.log (mode 600).
: ${TROVE_LOG_APP:=trove}

# Log directory override. Empty => per-user XDG state
# (${XDG_STATE_HOME:-~/.local/state}/trove/logs/<app>) for normal users, or
# /var/log/trove/<app> when running as root. Apps may point this anywhere.
: ${TROVE_LOG_DIR:=}

# Floor for what the FILE records (independent of the terminal TROVE_LOG_LEVEL).
# Default TRACE = capture everything. Raise to trim volume.
: ${TROVE_LOG_FILE_LEVEL:=TRACE}

# Retention: daily files older than this many days are pruned (per channel).
: ${TROVE_LOG_RETENTION_DAYS:=7}

# Line format: text (default, human/greppable) | json (one object per line).
: ${TROVE_LOG_FORMAT:=text}

# Redact secrets before writing (recommended). Reveals a short prefix then ***.
: ${TROVE_LOG_SCRUB:=true}

# Extra ':'-separated POSIX-ERE regexes to redact, appended to the built-ins.
: ${TROVE_LOG_SCRUB_PATTERNS:=}

# Whole-process capture (trove_log_capture_begin/end): true = live terminal + file,
# false = file-only (no live view). Both are drained fully before _end returns.
: ${TROVE_LOG_CAPTURE_TEE:=true}

###############################################################################
# Color
###############################################################################

# Color scheme: monokai | solarized | nord | dracula | gruvbox
: ${TROVE_COLORSCHEME:=monokai}

###############################################################################
# Monitoring (optional module — loaded via `trove_load monitoring`)
###############################################################################

# Enable monitoring helpers (true|false).
: ${TROVE_MONITORING_ENABLED:=false}

# Monitoring system URL for metric submission.
# Example: https://monitor.example.internal
: ${TROVE_MONITORING_URL:=""}
