# Trove Configuration File (optional)
#
# Auto-sourced by lib/trove_init.zsh if present. Every setting uses the
# `: ${VAR:=value}` form so an explicit environment variable always WINS over
# this file, and this file wins over the built-in defaults:
#
#     environment variable  >  this file  >  built-in default
#
# Delete this file to configure Trove purely by environment variables.

###############################################################################
# Logging
###############################################################################

# Log level filter — only messages at or above this level are shown.
# Levels: TRACE | DEBUG | INFO | WARN | ERROR | FATAL
: ${TROVE_LOG_LEVEL:=INFO}

# Master output switch. Set false to silence ALL Trove output ("logging off").
: ${TROVE_ENABLE_LOGGING:=true}

# Show command output in trove_silent_run (true|false).
: ${TROVE_OUTPUT_DISPLAY:=true}

###############################################################################
# Color
###############################################################################

# Color scheme: monokai | solarized | nord | dracula | gruvbox
: ${TROVE_COLORSCHEME:=monokai}

###############################################################################
# Monitoring (optional module — loaded via `trove_load monitoring`)
###############################################################################

# Enable monitoring helpers (true|false).
: ${TROVE_MONITORING_ENABLED:=false}

# Monitoring system URL for metric submission.
# Example: https://monitor.example.internal
: ${TROVE_MONITORING_URL:=""}
